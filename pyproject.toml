[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "waraq-pdf"
version = "1.6.0"
description = "An independent, local-first Arabic PDF desktop workspace"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "PySide6-Essentials==6.10.3",
  "pypdf[crypto]==6.10.0",
  "pypdfium2==5.14.0",
  "Pillow==12.3.0",
  "pywin32==311; sys_platform == 'win32'",
  "pyHanko==0.38.0",
]

[project.gui-scripts]
waraq-pdf = "waraq.app:main"

[tool.setuptools.packages.find]
include = ["waraq*"]
